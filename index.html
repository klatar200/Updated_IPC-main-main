<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d2d52" />
    <title>Insulation Products Corporation — Heat Shrink Tubing, Sleeving &amp; Adhesives</title>
    <meta
      name="description"
      content="IPC is a spec-grade stocking distributor of heat-shrinkable &amp; extruded tubing, electrical sleeving, and industrial adhesives. $50 minimum order. Ships same day. ISO 9001 registered."
    />

    <!-- Favicon & PWA manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.insulationproducts.com/" />
    <!-- A4. This shipped as a TODO comment and no usable og:image while
         twitter:card said summary_large_image, so every link pasted into
         LinkedIn, Teams, Slack or an email client previewed as a bare text
         card — on a site whose product URLs get pasted into procurement
         threads.

         This STATIC tag is the one that does most of the work. LinkedIn,
         Slack and Facebook do not execute JavaScript when they unfurl a link,
         so PageMeta's per-route override (which swaps in a product's own
         photograph) only reaches crawlers that render. Every URL therefore
         needs a correct absolute image right here in the shell.

         Absolute, not relative: several crawlers ignore a relative og:image.
         Width and height are declared so the first share renders without the
         crawler fetching the file to measure it.
         Built by _harness/ogcard.js; 1200x630, 33 KiB. -->
    <meta property="og:image"        content="https://www.insulationproducts.com/images/og-card.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Insulation Products Corporation — heat shrink tubing, sleeving and adhesives" />
    <meta property="og:title"       content="Insulation Products Corporation — Heat Shrink Tubing, Sleeving &amp; Adhesives" />
    <meta property="og:description" content="Spec-grade stocking distributor since 1974. $50 minimum order. 25M+ feet in stock. Ships same day. ISO 9001 registered." />
    <meta name="twitter:card"       content="summary_large_image" />

    <!-- Schema.org structured data is now rendered at runtime from the live
         business details (see StructuredData in src/App.jsx), so it stays in
         sync with what the customer edits in the admin. -->

    <!-- GA4: removed pending real Measurement ID -->

    <!--
      Tailwind is bundled at build time via postcss.config.js + tailwind.config.js
      (see src/index.css). Do NOT add the CDN script here for production — it
      bloats the bundle and prints a console warning.
    -->
  </head>
  <body>
    <!-- C38 — the whole site is client-rendered, so with JavaScript off or the
         bundle failing to load a visitor got a blank white page and no way to
         reach anyone. This is the floor: who IPC is, and how to call them.

         These values are a SECOND COPY of data/site-info.json and will not
         follow an admin edit — this is a static shell, so there is nowhere to
         read the live values from. That is a deliberate trade for a fallback
         that only ever renders when everything else has already failed, and it
         is written down here so nobody "fixes" it by wiring it to something
         that needs the bundle it exists to survive. If the phone number
         changes, change it here too.
         Styles are inline for the same reason: the CSS bundle may be the thing
         that failed. -->
    <noscript>
      <div style="max-width:38rem;margin:0 auto;padding:2.5rem 1.5rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#141414;line-height:1.55">

          This site needs JavaScript to browse the catalog. Please call or email us and we will help you directly.
        </p>
        <p style="margin:0 0 .4rem"><strong>Phone</strong> <a href="tel:+16307710700" style="color:#0a2240">630.771.0700</a></p>
        <p style="margin:0 0 .4rem"><strong>Fax</strong> 630.771.0701</p>
        <p style="margin:0 0 .4rem"><strong>Email</strong> <a href="mailto:sales@insulationproducts.com" style="color:#0a2240">sales@insulationproducts.com</a></p>
        <p style="margin:0 0 .4rem">250 Gibraltar Dr, Bolingbrook, IL 60440</p>
        <p style="margin:0;color:#4b5563">Mon&ndash;Fri, 8am&ndash;5pm CT</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
