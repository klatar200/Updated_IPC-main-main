; IPC — PHP limits for public_html/
;
; Deploy this file to the SAME folder as index.html (public_html/). On PHP-CGI
; / FastCGI hosting — which is what Network Solutions shared hosting uses —
; .user.ini applies to the folder and everything under it, including admin/.
; It has NO effect under mod_php; if these values don't take, move the same
; directives into a php.ini in public_html/ or an Apache php_value line.
;
; Why each one (DEPLOY_READINESS_v2 §3.5, §3.7):
;
;   upload_max_filesize / post_max_size
;     admin/help.php promises "20MB or smaller" for data sheets. PHP's stock
;     defaults are 2M and 8M, so a 2.6MB PDF was rejected with "Please select a
;     PDF file to upload" and a 10MB one produced a bare 403 CSRF page. Both
;     must be raised, and post_max_size must exceed upload_max_filesize.
;
;   max_input_vars
;     admin/content.php posts 453 input variables today and grows by 3 per FAQ
;     entry and 7 per service. PHP truncates $_POST at the limit SILENTLY.
;     content.php now detects truncation and refuses to save, but headroom is
;     better than a refusal.
;
; VERIFY THESE APPLIED: sign in to the admin and open the Help page — it prints
; the server's live values. If they still read 2M/8M/1000, .user.ini is being
; ignored on this host; tell the developer.

;   display_errors / log_errors
;     PHP emits request-STARTUP diagnostics (over-post_max_size, and every
;     max_input_vars truncation) before a single line of our code runs. With
;     display_errors on they are printed first, so headers are already sent and
;     session_set_cookie_params(), session_name() and session_start() all fail —
;     measured: a truncated content.php POST returned 3,010 bytes of warnings,
;     no session, no page, and the absolute server path disclosed four times.
;     The T3.5 "that upload was too large" page and the T3.7 truncation guard
;     both need this OFF to render at all. Errors still go to the host's log.
;     (AUDIT_v3_FINDINGS NB2)

upload_max_filesize = 24M
post_max_size = 32M
max_input_vars = 5000
max_file_uploads = 20

display_errors = Off
log_errors = On

; Long-form editing sessions: the admin writes multi-paragraph About/FAQ copy.
; PHP's 1440s default signed people out mid-sentence.
session.gc_maxlifetime = 28800
