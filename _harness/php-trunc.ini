; Truncation server (port 8124).
; max_input_vars=100 forces PHP to genuinely truncate the content.php POST, so
; the `form_complete` sentinel goes missing for real rather than being faked by
; the test dropping the field. display_errors=Off mirrors public/.user.ini —
; the B1 truncation guard depends on the "PHP Warning: max_input_vars exceeded"
; notice NOT being echoed into the page.
display_errors = Off
error_reporting = E_ALL
log_errors = Off
max_input_vars = 100
post_max_size = 24M
upload_max_filesize = 24M
date.timezone = America/Chicago
; A test server must never serve stale bytecode. With the default
; opcache.revalidate_freq=2, a suite that rewrites a PHP file and immediately
; re-requests it can land inside the 2-second window and measure the PREVIOUS
; file — plan2-formlast-selftest failed exactly once that way, restoring the
; mirror and still being served the mutant. Stat on every request instead.
opcache.revalidate_freq = 0
