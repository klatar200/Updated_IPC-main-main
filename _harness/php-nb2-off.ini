; NB2 negative control (port 8125).
; Same max_input_vars=100 truncation as 8124, but display_errors=On. This is
; the control that proves a suite can distinguish "the guard caught it" from
; "PHP printed a warning and the page looked broken anyway". A suite that
; passes identically on 8124 and 8125 is not measuring what it claims to.
display_errors = On
error_reporting = E_ALL
log_errors = Off
max_input_vars = 100
post_max_size = 24M
upload_max_filesize = 24M
date.timezone = America/Chicago
; A test server must never serve stale bytecode. With the default
; opcache.revalidate_freq=2, a suite that rewrites a PHP file and immediately
; re-requests it can land inside the 2-second window and measure the PREVIOUS
; file — plan2-formlast-selftest failed exactly once that way, restoring the
; mirror and still being served the mutant. Stat on every request instead.
opcache.revalidate_freq = 0
