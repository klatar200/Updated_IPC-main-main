; Main harness server (port 8123).
; display_errors=On so a PHP notice/warning surfaces in the response body
; instead of being swallowed — several suites assert on a clean page.
display_errors = On
error_reporting = E_ALL
log_errors = Off
; Stock max_input_vars: the content.php form must post in full here.
max_input_vars = 10000
post_max_size = 24M
upload_max_filesize = 24M
date.timezone = America/Chicago
