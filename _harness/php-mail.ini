; Harness server with a capturing sendmail (port 8123).
; The ONLY ini for port 8123. sendmail_path points at _harness/fakemail.sh so
; mail() succeeds and the message is written to a log the suites can read.
; Without this every POST dies at contact.php's "mail server could not send"
; branch and nothing past it — including the auto-reply cap (4.15b) — runs.
display_errors = On
error_reporting = E_ALL
log_errors = Off
max_input_vars = 10000
post_max_size = 24M
upload_max_filesize = 24M
date.timezone = America/Chicago
; `php -S` runs with its working directory at the docroot — measured, not
; assumed: getcwd() there is <repo>/_harness/site. An absolute path would
; hardcode one machine's checkout, "_harness/fakemail.sh" fails because the cwd
; is not the repo root, and the old "../fakemail.sh" worked ONLY for a docroot
; exactly one level under _harness/: every private mirror copy
; (_harness/out/<you>/site) answered the contact form with "The mail server
; could not send your message" and logged the lead as not sent (AUDIT-12
; A12-L13-W1-G2-2). So walk up from the docroot to the first directory holding
; fakemail.sh. PHP appends "-t -i"; they land in sh's positional args, unused.
; Set IPC_MAIL_LOG per server for a private mail log (default: the shared
; /tmp/ipc-harness-mail.log the sweep suites read).
sendmail_path = "sh -c 'd=$(pwd -P); while [ ! -f $d/fakemail.sh ] && [ $d != / ]; do d=$(dirname $d); done; exec sh $d/fakemail.sh' fakemail"
; A test server must never serve stale bytecode. With the default
; opcache.revalidate_freq=2, a suite that rewrites a PHP file and immediately
; re-requests it can land inside the 2-second window and measure the PREVIOUS
; file — plan2-formlast-selftest failed exactly once that way, restoring the
; mirror and still being served the mutant. Stat on every request instead.
opcache.revalidate_freq = 0
